# Publicare pe Netlify
#  - paginile (aplicația publică și dashboardul /admin/) vin din directorul public/
#  - API-ul (/api/*) rulează ca funcție Netlify: netlify/functions/api.mjs
#  - datele se salvează în Netlify Blobs (în contul Netlify, fără configurare suplimentară)
#  - pozițiile vehiculelor în timp real (/live/vehicule) vin din funcția netlify/functions/vehicule.mjs
#  - colectarea GPS la fiecare minut (funcție programată netlify/functions/gps-colectare.mjs, în Netlify Blobs, store-ul „gps”)
#    și istoricul ei (/live/istoric) – pentru harta /transport/sanatate/
#  - aplicația Iași Live (/live/, public/live/): harta vectorială OpenFreeMap (tiles.openfreemap.org) cu MapLibre,
#    care își pornește procesele de fundal din blob: – de aici worker-src și tiles.openfreemap.org în politica CSP
# Setări (variabile de mediu): ADMIN_PASSWORD (obligatorie, parola dashboardului); TRANZY_API_KEY (cheia API Tranzy
# pentru vehiculele în timp real de pe /transport/ – fără ea, doar acel strat nu funcționează).

[build]
  publish = "public"
  command = "echo 'fără pas de build'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["config/periods.json"]

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://tiles.openfreemap.org; connect-src 'self' https://nominatim.openstreetmap.org https://tiles.openfreemap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

[[headers]]
  for = "/live/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
