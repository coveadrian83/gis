name: Build APK

on:
  push:
    branches: [ "claude/android-social-media-tracker-C7T7I", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setare Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Permisiuni Gradle wrapper
        run: chmod +x SocialMediaTracker/gradlew

      - name: Build APK (debug)
        working-directory: SocialMediaTracker
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Redenumire APK
        run: cp SocialMediaTracker/app/build/outputs/apk/debug/app-debug.apk SocialMediaTracker/app/build/outputs/apk/debug/FaraEcrane.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FaraEcrane-APK
          path: SocialMediaTracker/app/build/outputs/apk/debug/FaraEcrane.apk
          retention-days: 30
