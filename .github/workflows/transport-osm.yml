# Descarcă din OpenStreetMap (Overpass) liniile și stațiile de transport public din Iași și ZMI
# (scripts/transport_osm.py) în data/transport/osm/, extrage traseele tramvaiului pe linii, regenerează traseele hărții
# și comparația cu OSM (scripts/transport_compara_osm.py → /transport/comparatie.html).
# Rulează singur când se modifică scriptul sau acest fișier; manual: Actions → „Date OSM transport public” → Run workflow.
name: Date OSM transport public

on:
  workflow_dispatch:
  push:
    # pe main nu rulează la push: rulează pe branch-ul PR-ului (publicările de acolo sunt gratuite), iar datele intră pe
    # main odată cu merge-ul – altfel, după fiecare merge, un commit automat în plus = încă o publicare (15 credite)
    branches-ignore: [main]
    paths:
      - scripts/transport_osm.py
      - scripts/transport_compara_osm.py
      - scripts/transport_amtpi.py
      - .github/workflows/transport-osm.yml

permissions:
  contents: write

concurrency:
  group: transport-osm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyshp pyproj shapely
      - name: Lista oficială a traseelor AMTPI
        run: python scripts/transport_amtpi.py || echo "amtpi.ro indisponibil – se păstrează lista existentă"
      - name: Descarcă din Overpass (și extrage traseele tramvaiului și liniile AMTPI fără KMZ)
        run: python scripts/transport_osm.py
      - name: Regenerează traseele hărții și comparația cu OSM
        run: |
          python scripts/transport_gtfs.py
          python scripts/transport_linii.py data/transport/linii
          python scripts/transport_compara_osm.py
      - name: Salvează datele în branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/transport/osm data/transport/linii data/transport/amtpi_trasee.json public/data/transport
          if git diff --cached --quiet; then echo "Datele nu s-au schimbat."; exit 0; fi
          git commit -m "Transport public: date OSM descărcate"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
